[project]
name = "sec-research-desk-backend"
version = "0.1.0"
description = "Local SEC Research Desk API"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.5,<5",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.26,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
